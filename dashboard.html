<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard - PayShield</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="header">
    <img src="{{ url_for('static', filename='logo.svg') }}" class="logo-img" alt="PayShield logo">
    <div>
      <div class="brand">PayShield</div>
      <div class="tag">Welcome back{% if email %}, {{ email }}{% endif %}</div>
    </div>
    <div class="ms-auto">
      <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">Logout</a>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-8">
        <div class="card p-4 shadow-sm">
          <h4>Your PayShield Dashboard</h4>
          <p class="text-muted">Quick actions</p>
          <div class="row g-3">
            <div class="col-sm-6"><button class="btn btn-light w-100">Send money</button></div>
            <div class="col-sm-6"><button class="btn btn-light w-100">Request money</button></div>
            <div class="col-sm-6"><button class="btn btn-light w-100">Transactions</button></div>
            <div class="col-sm-6"><button class="btn btn-light w-100">Profile</button></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h5>Account</h5>
          <p class="mb-1"><strong>{{ email }}</strong></p>
          <small class="text-muted">Member since: --</small>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
