<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - PayShield</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">
  <div class="header">
    <img src="{{ url_for('static', filename='logo.svg') }}" class="logo-img" alt="PayShield logo">
    <div>
      <div class="brand">PayShield</div>
      <div class="tag">Secure payments, simplified</div>
    </div>
  </div>

  <div class="container center-card">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg">
          <div class="card-body p-4">
            <h3 class="text-center mb-3">Create your PayShield account</h3>
            <form method="post" action="{{ url_for('register') }}">
              <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
              </div>
              <button class="btn btn-success pay-button" type="submit">Register</button>
            </form>
            <p class="mt-3 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
          </div>
        </div>
        <p class="footer-note">We will send an OTP to verify your email.</p>
      </div>
    </div>
  </div>
</body>
</html>
